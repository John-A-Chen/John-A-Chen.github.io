<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Experience page for John Alfred Chen including engineering experience and education timeline."
    />
    <title>Experience | John Alfred Chen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link rel="icon" type="image/jpeg" href="assets/images/profile/channels4_profile.jpg" />
  </head>
  <body class="experience-page">
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header">
      <nav class="nav container" aria-label="Primary">
        <a class="brand" href="index.html" aria-label="Home">
          <span class="brand-mark" data-profile="initials">JC</span>
          <span class="brand-text">
            <span class="brand-title" data-profile="name">John Alfred Chen</span>
            <span class="brand-subtitle">Engineering Portfolio</span>
          </span>
        </a>

        <a class="button compact random-project-link" data-random-project href="portfolio.html"
          >Random Project</a
        >
      </nav>
    </header>

    <main id="main-content">
      <section class="section">
        <article class="container experience-shell reveal">
          <header class="experience-header">
            <h1 class="page-title">Experience</h1>
            <a
              class="button button-ghost compact"
              href="assets/docs/John_A_Chen_CV.pdf"
              target="_blank"
              rel="noreferrer"
              >Open CV (PDF)</a
            >
          </header>

          <section class="exp-block" aria-labelledby="exp-work-heading">
            <div class="exp-block-head">
              <h2 class="exp-heading" id="exp-work-heading">Work</h2>
              <div class="seg" role="tablist" aria-label="Type of experience" id="experience-tabs"></div>
            </div>
            <ol class="timeline-list" id="experience-list" role="tabpanel"></ol>
          </section>

          <section class="exp-block" aria-labelledby="exp-edu-heading">
            <h2 class="exp-heading" id="exp-edu-heading">Education</h2>
            <ol class="timeline-list" id="education-list"></ol>
          </section>

          <section class="exp-block" aria-labelledby="exp-cert-heading">
            <h2 class="exp-heading" id="exp-cert-heading">Certifications and awards</h2>
            <ul class="credential-list" id="certification-grid"></ul>
          </section>
        </article>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-bar">
        <p class="footer-id">
          <span class="footer-title" data-profile="name">John Alfred Chen</span>
          <span class="footer-copy" data-profile="tagline">Mechanical design / Robotics / Embedded hardware</span>
        </p>
        <nav class="footer-links" aria-label="Footer">
          <a href="portfolio.html">Portfolio</a>
          <a href="experience.html">Experience</a>
          <a href="contact.html">Contact</a>
          <a data-profile-link="github" href="#">GitHub</a>
          <a data-profile-link="linkedin" href="#">LinkedIn</a>
        </nav>
        <p class="footer-year">&copy; <span data-current-year></span></p>
      </div>
    </footer>

    <script type="module" src="assets/js/experience.js"></script>
  </body>
</html>
